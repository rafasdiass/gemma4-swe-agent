name: Submission Validation

# Gate de promoção: roda em PRs para main (dev -> main), antes do merge que
# autoriza a construção da submissão. Valida a estrutura do repo; o zip em si
# é construído no Kaggle (nunca versionado no repo).
on:
  pull_request:
    branches: [main]

jobs:
  validate-submission:
    name: Validate Submission Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate repo structure (dry-run, strict)
        run: python scripts/validate_submission.py --dry-run --strict
