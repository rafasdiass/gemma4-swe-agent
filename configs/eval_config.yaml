# Per-task time limits for 12h total budget
task_limits:
  code_analysis:
    max_time_seconds: 7200      # 2h - repo navigation, issue understanding
    max_retries: 2
  patch_generation:
    max_time_seconds: 21600     # 6h - coding, iteration
    max_retries: 3
  verification:
    max_time_seconds: 7200      # 2h - test running, validation
    max_retries: 2

# Budget management
total_budget_seconds: 43200     # 12h total
warning_threshold_pct: 80       # Warn at 80% budget used
critical_threshold_pct: 95      # Critical at 95% budget used

# Ensemble strategy
ensemble:
  enabled: true
  strategy: "router_per_issue_type"
  issue_types:
    - bug_fix
    - feature
    - refactor
  selection: "best_pass_rate"
