# Gemma 4 Developer Agent Competition - Agent Config (schema SandboxedAgentConfig / ADK)
# Model: gemma-4-31b-it-qat-w4a16-ct (31B, QAT W4A16)
# Planning: olimp-gemma4-swe-2026-q4 (T-09, migração A-12)

name: "gemma4-swe-agent"
model: "gemma-4-31b-it-qat-w4a16-ct"
description: "Autonomous software engineering agent for the Gemma 4 Developer Agent Competition"

# Instruction com templating do session.state ({problem_description}, {hints})
instruction: !include prompts/system.md

# Tools do sandbox (as 9 reais). submit_patch fica SOMENTE no root:
# chamar submit_patch encerra a sessão.
tools:
  - run_command
  - read_file
  - edit_file
  - write_file
  - submit_patch
  - get_status
  - get_code_neighbors
  - search_similar_code
  - get_code_subgraph

# Sub-agentes: LISTA de {config_path} (dict nomeado com !include era a divergência A-12).
# Registro != invocação: a disciplina de delegação vive no prompt (prompts/system.md).
sub_agents:
  - config_path: sub_agents/code_analyzer.yaml
  - config_path: sub_agents/patch_generator.yaml
  - config_path: sub_agents/verifier.yaml

# Skills: PATHS relativos (não nomes)
skills:
  - skills/repo_navigation
  - skills/test_generation
  - skills/patch_validation

# Sampling canônico (era `sampling:`; `repetition_penalty` não existe no allowed_fields)
generate_content_config: !include configs/sampling.yaml
