# Gemma 4 Developer Agent Competition - Agent Config (ADK Spec)
# Model: gemma-4-31b-it-qat-w4a16-ct (31B, QAT W4A16)
# Competition: Gemma 4 Developer Agent Competition
# Planning: olimp-gemma4-swe-2026-q4

agent_id: "gemma4-swe-agent"
model: "gemma-4-31b-it-qat-w4a16-ct"
description: "Autonomous Software Engineering Agent for Gemma 4 Developer Agent Competition"

# Sampling configuration
sampling: !include configs/sampling.yaml

# System prompt
system_prompt: !include prompts/system.md

# Tools available in the competition sandbox
tools:
  - run_command
  - read_file
  - edit_file
  - write_file
  - submit_patch
  - get_code_neighbors
  - search_similar_code
  - get_code_subgraph
  - get_status

# Sub-agents (AgentTool)
sub_agents:
  code_analyzer: !include sub_agents/code_analyzer.yaml
  patch_generator: !include sub_agents/patch_generator.yaml
  verifier: !include sub_agents/verifier.yaml

# LoRA Adapters
adapters:
  main_lora:
    adapter: adapters/main_lora/adapter_config.json
    path: adapters/main_lora/adapter_model.safetensors
  tool_lora:
    adapter: adapters/tool_lora/adapter_config.json
    path: adapters/tool_lora/adapter_model.safetensors

# Skills
skills:
  - repo_navigation
  - test_generation
  - patch_validation

# Evaluation config
eval_config: !include configs/eval_config.yaml
