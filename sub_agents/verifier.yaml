# Verifier (segunda opinião independente; invocação rara, só em patch arriscada)
name: "verifier"
model: "gemma-4-31b-it-qat-w4a16-ct"
description: "Independent patch review: run tests, check regressions, report PASS/FAIL with evidence. Delegate for a fresh-context review of a risky patch."

instruction: !include ../prompts/verifier.md

# SEM submit_patch (encerrava a sessão na v0.1) e sem write — verifier só lê e executa
tools:
  - run_command
  - read_file

generate_content_config:
  temperature: 0.1
  top_p: 0.9
  max_output_tokens: 8192
  thinking_config:
    thinking_budget: 4096
