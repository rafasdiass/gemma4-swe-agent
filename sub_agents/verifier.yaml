# Verifier Sub-Agent (AgentTool)
agent_id: "verifier"
model: "gemma-4-31b-it-qat-w4a16-ct"
description: "Test execution and patch validation specialist"

system_prompt: !include ../prompts/verifier.md

tools:
  - run_command
  - read_file
  - submit_patch

sampling:
  temperature: 0.1
  top_p: 0.9
  max_tokens: 4096

capabilities:
  - test_execution
  - regression_testing
  - patch_validation
  - quality_gates
